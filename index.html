<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리학교 AI 체육관 - 스포츠 게임 3종</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f6f8;color:#18212b}
.wrap{max-width:1100px;margin:auto;padding:24px}.title{font-size:30px;font-weight:800;margin-bottom:6px}.sub{color:#687481;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #dfe4e8;border-radius:18px;padding:20px;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px)}
.icon{font-size:42px}.card h2{margin:8px 0}.card p{color:#687481;line-height:1.5}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:#1d6fe8;color:white}.back{background:#e9edf1;color:#27313a;margin-bottom:12px}
.screen{background:#111923;border-radius:18px;overflow:hidden;position:relative}.screen video{width:100%;display:block;transform:scaleX(-1)}.overlay{position:absolute;inset:0;pointer-events:none}.hud{position:absolute;left:16px;top:14px;color:white;font-size:18px;font-weight:700;text-shadow:0 2px 4px #000}.target{position:absolute;border:5px solid #fff;border-radius:50%;width:80px;height:80px;transform:translate(-50%,-50%);box-shadow:0 0 0 4px #1d6fe8}.result{background:white;border-radius:16px;padding:18px;margin-top:14px;text-align:center}.big{font-size:46px;font-weight:900}.criteria{background:#fff;border:1px solid #dfe4e8;border-radius:14px;padding:14px;margin:12px 0;line-height:1.55}.hidden{display:none!important}.center{text-align:center}
@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="home">
    <div class="title">🏫 우리학교 AI 체육관</div>
    <div class="sub">몸을 움직여서 실제 스포츠 동작을 수행하는 게임 3종</div>
    <div class="grid">
      <div class="card" data-game="rope"><div class="icon">🪢</div><h2>1. 줄넘기 챌린지</h2><p>가상의 줄이 발밑을 지나갈 때 점프! 실제 줄넘기 동작과 연결해 연습해요.</p></div>
      <div class="card" data-game="soccer"><div class="icon">⚽</div><h2>2. 축구 수비수</h2><p>공이 좌우로 날아오면 몸을 옮겨 막기! 사이드 스텝과 수비 자세를 연습해요.</p></div>
      <div class="card" data-game="volley"><div class="icon">🏐</div><h2>3. 배구 리시브</h2><p>날아오는 공의 위치로 이동해 팔을 모아 리시브 자세를 만들어요.</p></div>
    </div>
  </div>

  <div id="game" class="hidden">
    <button class="btn back" id="back">← 스테이션 목록</button>
    <h1 id="gameTitle"></h1>
    <div class="criteria" id="criteria"></div>
    <div class="screen">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" class="overlay"></canvas>
      <div id="target" class="target hidden"></div>
      <div class="hud" id="hud"></div>
    </div>
    <div class="center" style="margin-top:12px"><button class="btn" id="start">게임 시작</button></div>
    <div id="result" class="result hidden" aria-live="polite"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script>
const home=document.getElementById('home'), game=document.getElementById('game');
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const title=document.getElementById('gameTitle'), criteria=document.getElementById('criteria'), hud=document.getElementById('hud');
const target=document.getElementById('target'), result=document.getElementById('result'), start=document.getElementById('start');
let stream=null, pose=null, mode='', running=false, raf=0, timer=null, score=0, hits=0, objects=[], lastPose=null, lastJump=0;

const games={
 rope:{title:'🪢 줄넘기 챌린지', criteria:'<b>인식 기준</b><br>① 양발이 함께 바닥에서 올라가기<br>② 엉덩이(양쪽 골반 중앙)가 위로 올라갔다가 다시 내려오기<br>③ 팔만 움직이는 것은 점프로 인정하지 않음', time:30},
 soccer:{title:'⚽ 축구 수비수', criteria:'<b>인식 기준</b><br>① 양쪽 엉덩이 중앙이 공의 이동 방향으로 움직이기<br>② 몸통을 좌우로 이동해 공과 충돌하지 않기<br>③ 공이 내 위치에 닿기 전에 이동하면 성공', time:30},
 volley:{title:'🏐 배구 리시브', criteria:'<b>인식 기준</b><br>① 날아오는 공 방향으로 이동하기<br>② 양손이 몸 앞에서 가까워지는 자세 만들기<br>③ 팔을 모은 상태로 공 높이에 몸을 맞추면 리시브 성공', time:30}
};

function resize(){canvas.width=video.clientWidth;canvas.height=video.clientHeight}
window.addEventListener('resize',resize);

async function camera(){
 if(stream)return;
 stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
 video.srcObject=stream; await video.play(); resize();
 pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
 pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:.55,minTrackingConfidence:.55});
 pose.onResults(onPose);
}

function openGame(m){
 mode=m; home.classList.add('hidden');game.classList.remove('hidden');
 const g=games[m]; title.textContent=g.title; criteria.innerHTML=g.criteria;
 result.classList.add('hidden');start.disabled=false;start.textContent='게임 시작';target.classList.add('hidden');hud.textContent='';
 camera().catch(e=>{hud.textContent='카메라 권한을 허용해 주세요.'});
}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openGame(c.dataset.game)));
document.getElementById('back').addEventListener('click',()=>stopGame());

function stopGame(){
 running=false;clearTimeout(timer);cancelAnimationFrame(raf);objects=[];
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null} 
 video.srcObject=null; game.classList.add('hidden');home.classList.remove('hidden');
}

start.addEventListener('click',()=>{if(running)return;startGame()});

function startGame(){
 running=true;score=0;hits=0;objects=[];lastPose=null;lastJump=0;
 result.classList.add('hidden');start.disabled=true;
 const end=Date.now()+games[mode].time*1000;
 function tick(){
   if(!running)return;
   const left=Math.max(0,Math.ceil((end-Date.now())/1000));
   hud.textContent=`남은 시간 ${left}초  |  성공 ${score}  |  실패 ${hits}`;
   if(left<=0){finish();return}
   if(mode==='rope')ropeFrame();
   if(mode==='soccer')soccerFrame();
   if(mode==='volley')volleyFrame();
   raf=requestAnimationFrame(tick);
 }
 tick();
}

async function onPose(res){
 if(!running||!res.poseLandmarks)return;
 lastPose=res.poseLandmarks;
 draw(res.poseLandmarks);
 if(mode==='rope')ropePose(res.poseLandmarks);
 if(mode==='soccer')soccerPose(res.poseLandmarks);
 if(mode==='volley')volleyPose(res.poseLandmarks);
}

function draw(p){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='rgba(255,255,255,.9)';
 p.forEach(x=>{ctx.beginPath();ctx.arc((1-x.x)*canvas.width,x.y*canvas.height,4,0,Math.PI*2);ctx.fill()});
}
function center(p,a,b){return {x:(1-(p[a].x+p[b].x)/2)*canvas.width,y:(p[a].y+p[b].y)/2*canvas.height}}
function ropePose(p){
 const h=center(p,23,24);
 // 엉덩이 중심의 위쪽 이동 후 내려오는 주기를 1회로 계산
 const now=h.y;
 if(!ropePose.prev)ropePose.prev=now;
 const up=ropePose.prev-now;
 if(up>12) ropePose.armed=true;
 if(ropePose.armed && now-ropePose.prev>7){score++;ropePose.armed=false}
 ropePose.prev=now;
}
function ropeFrame(){
 const y=canvas.height*.78, t=Date.now()/220;
 ctx.strokeStyle='white';ctx.lineWidth=6;ctx.beginPath();
 for(let x=0;x<canvas.width;x+=10){const yy=y+Math.sin(x/80+t)*14;ctx.lineTo(x,yy)}ctx.stroke();
 ctx.font='bold 24px Arial';ctx.fillStyle='white';ctx.fillText('⬆ 줄이 발밑으로 지나갈 때 점프!',20,canvas.height-25);
}
function resetPrev(){ropePose.prev=null;ropePose.armed=false}

function spawn(kind){
 const y=.38+Math.random()*.28;
 const side=Math.random()<.5?-.1:1.1;
 objects.push({x:side,y,tx:.5,created:Date.now(),speed:.004+Math.random()*.002,kind});
}
function moveObj(o){
 const dx=.5-o.x, dy=.68-o.y; const d=Math.hypot(dx,dy)||1;
 o.x+=dx/d*o.speed*16;o.y+=dy/d*o.speed*16;
}
function soccerFrame(){
 if(Math.random()<.025)spawn('soccer');
 ctx.font='48px Arial';
 objects.forEach(o=>{moveObj(o);ctx.fillText('⚽',o.x*canvas.width,o.y*canvas.height)});
 objects=objects.filter(o=>{
   if(o.x>.45&&o.x<.55&&o.y>.58){hits++;return false}
   return o.x>-.15&&o.x<1.15&&o.y<1.05
 });
}
function soccerPose(p){
 const h=center(p,23,24);
 // 공이 화면 중앙 근처에 있을 때 골반이 공 반대편으로 이동하면 회피 성공
 objects.forEach(o=>{
   const ox=o.x*canvas.width, oy=o.y*canvas.height;
   const d=Math.hypot(h.x-ox,h.y-oy);
   if(d<90){o.x=h.x<ox/canvas.width?.2:.8;score++}
 });
}

function volleyFrame(){
 if(Math.random()<.035)spawn('volley');
 ctx.font='48px Arial';
 objects.forEach(o=>{moveObj(o);ctx.fillText('🏐',o.x*canvas.width,o.y*canvas.height)});
 objects=objects.filter(o=>{
   if(o.x>.44&&o.x<.56&&o.y>.55){hits++;return false}
   return o.x>-.15&&o.x<1.15&&o.y<1.05
 });
}
function volleyPose(p){
 const lh=p[15],rh=p[16], ls=p[11],rs=p[12];
 const hx=(1-(p[23].x+p[24].x)/2)*canvas.width, hy=(p[23].y+p[24].y)/2*canvas.height;
 const handsClose=Math.hypot(lh.x-rh.x,lh.y-rh.y)<.16;
 objects.forEach(o=>{
   const ox=o.x*canvas.width,oy=o.y*canvas.height;
   if(Math.hypot(hx-ox,hy-oy)<105 && handsClose){score++;o.x=-2}
 });
 objects=objects.filter(o=>o.x>-1);
}

function finish(){
 running=false;cancelAnimationFrame(raf);clearTimeout(timer);
 const total=score+hits; const pct=total?Math.round(score/total*100):0;
 result.innerHTML=`<div>게임 종료!</div><div class="big">${pct}점</div><div>성공 ${score}회 · 실패 ${hits}회</div><br><button class="btn" id="again">🔄 다시 하기</button> <button class="btn back" id="list">← 목록</button>`;
 result.classList.remove('hidden');start.disabled=false;
 document.getElementById('again').onclick=startGame;
 document.getElementById('list').onclick=stopGame;
 if(mode==='rope')resetPrev();
}
</script>
</body>
</html>
