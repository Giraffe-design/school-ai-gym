<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리학교 AI 체육관</title>
<style>
*{box-sizing:border-box}
:root{--ink:#172033;--muted:#667085;--line:#e6eaf0;--bg:#f5f7fb;--card:#fff;--accent:#3b82f6;--good:#16a34a;--bad:#ef4444}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(135deg,#f7f9fc,#edf4ff);min-height:100vh}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.app{max-width:1180px;margin:0 auto;padding:24px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:900;font-size:22px}.brand small{display:block;color:#7a8495;font-size:11px;letter-spacing:1.5px;margin-top:3px}
.badge{padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:999px;font-weight:800;font-size:13px}
.hero{background:var(--ink);color:white;border-radius:28px;padding:30px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 18px 45px #17203322}
.hero h1{font-size:38px;margin:4px 0 8px}.hero p{margin:0;color:#cbd5e1}.heroScore{text-align:center;min-width:180px}.heroScore strong{font-size:68px;line-height:1}.heroScore span{display:block;color:#cbd5e1;font-weight:800}
.progress{height:8px;background:#ffffff22;border-radius:9px;margin-top:20px;overflow:hidden}.progress i{display:block;height:100%;background:#60a5fa;width:0;transition:.3s}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;min-height:205px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 25px #1720330a;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px #17203316}
.card.done{border-color:#86efac}.num{font-size:12px;font-weight:900;color:#94a3b8;letter-spacing:1px}.icon{font-size:42px;margin:12px 0 4px}.card h3{margin:0 0 5px;font-size:21px}.card p{margin:0;color:var(--muted);font-size:13px}.card button{margin-top:14px;border:0;background:#eef4ff;color:#2563eb;border-radius:12px;padding:10px;font-weight:900}
.card.done button{background:#ecfdf3;color:#15803d}
.footerNote{text-align:center;color:#8792a3;font-size:12px;margin:20px}
.screen{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 12px 35px #17203310}
.stationHead{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:0;background:#eef2f7;border-radius:12px;padding:10px 14px;font-weight:900}.stationHead h2{margin:0;font-size:28px}.stationHead .tag{margin-left:auto;color:#64748b;font-size:12px;font-weight:900}
.gameLayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}
.playArea{position:relative;background:#eaf2f8;border-radius:22px;overflow:hidden;min-height:500px}
.side{border:1px solid var(--line);border-radius:20px;padding:20px;background:#fff}.side h4{margin:0 0 10px;color:#64748b;letter-spacing:1px}.rule{font-size:26px;font-weight:900;line-height:1.2;margin:12px 0 18px}.hint{font-size:13px;color:#667085;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:18px 0}.stat{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:26px}.start{width:100%;border:0;border-radius:14px;background:var(--ink);color:#fff;padding:14px;font-weight:900}.start.running{background:#dbeafe;color:#1d4ed8}.live{font-weight:800;margin:12px 0;min-height:20px}.good{color:var(--good)}.warn{color:#b45309}.bad{color:var(--bad)}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}.camWrap{position:absolute;inset:0}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.guideLine{position:absolute;inset:7%;border:2px dashed #fff9;border-radius:20px;pointer-events:none}.guideText{position:absolute;left:16px;top:16px;background:#172033cc;color:#fff;padding:9px 12px;border-radius:10px;font-weight:900}
.result{position:absolute;inset:0;background:#172033eF;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;z-index:20}.resultBox{background:#fff;color:var(--ink);border-radius:26px;padding:30px;min-width:300px}.resultBox .big{font-size:70px;font-weight:900}.resultBox button{border:0;background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:900;margin-top:12px}
.target{position:absolute;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:900;border:5px solid #fff;box-shadow:0 7px 20px #0004;user-select:none}
.reaction{background:#22c55e}.numberTarget{background:#3b82f6;color:#fff}.mole{background:#8b5cf6}
.target.fade{animation:pop .16s ease forwards}@keyframes pop{to{transform:scale(.1);opacity:0}}
.moleBoard{position:absolute;inset:0;padding:35px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:18px;background:#b7df9b}
.hole{position:relative;border:0;border-radius:50%;background:#654321;box-shadow:inset 0 12px 0 #3b2414;overflow:hidden}
.moleFace{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);width:105px;height:88px;background:#a66a3f;border-radius:50% 50% 38% 38%;display:grid;place-items:center;font-size:34px;transition:bottom .12s ease,transform .12s ease;z-index:2;box-shadow:0 -5px 12px #0003}
.hole.active .moleFace{bottom:3px;transform:translateX(-50%) scale(1.03)}
.jack{position:absolute;inset:0;display:grid;place-items:center}.jack .person{font-size:110px}.flash{position:absolute;inset:0;background:#22c55e33;opacity:0}
.board{position:absolute;inset:0;background:#173f68;padding:26px;display:flex;flex-direction:column}.chalk{background:#e8edf0;border-radius:12px;flex:1;position:relative;overflow:hidden}.chalkGrid{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 48px,#c5cdd2 49px 50px),repeating-linear-gradient(90deg,transparent 0 48px,#c5cdd2 49px 50px);opacity:.45}.word{position:absolute;font-size:34px;font-weight:900;color:#23364d;user-select:none}.eraser{position:absolute;width:74px;height:74px;border-radius:16px;background:#fff;border:5px solid #dbe3ea;box-shadow:0 7px 15px #0003;display:none;pointer-events:none}.eraser.on{display:block}
.calc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:linear-gradient(135deg,#eff6ff,#f8fafc)}.equation{font-size:58px;font-weight:900}.answers{display:grid;grid-template-columns:repeat(2,180px);gap:12px}.answers button{border:0;background:#fff;border:2px solid #dbe3ee;border-radius:16px;padding:18px;font-size:25px;font-weight:900}.answers button:hover{border-color:#60a5fa;background:#eff6ff}
.daily{background:var(--ink);color:#fff;border-radius:28px;padding:32px;text-align:center}.daily h2{font-size:32px;margin:0}.dailyScore{font-size:92px;font-weight:900;margin:12px}.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.break{background:#ffffff12;border-radius:14px;padding:12px}.break b{display:block;font-size:25px}.resultBtns{display:flex;gap:10px;justify-content:center;margin-top:22px}.resultBtns button{border:0;border-radius:12px;padding:13px 20px;font-weight:900}.primary{background:#fff;color:var(--ink)}.secondary{background:#ffffff18;color:#fff}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.gameLayout{grid-template-columns:1fr}.side{order:-1}.heroScore{min-width:120px}.breakdown{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.app{padding:12px}.grid{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:29px}.heroScore strong{font-size:52px}.answers{grid-template-columns:repeat(2,1fr);width:90%}.answers button{width:100%}.equation{font-size:40px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">우리학교 AI 체육관<small>AI MOTION TRAINING CENTER</small></div><div class="badge" id="todayBadge"></div></header>

<section id="home">
<div class="hero">
<div>
<div style="font-weight:900;color:#93c5fd">TODAY'S PE CHALLENGE</div>
<h1>오늘의 체육 점수</h1>
<p id="heroText">7개 게임에 도전하고 나만의 체육 점수를 만들어 보세요.</p>
<div class="progress"><i id="bar"></i></div>
</div>
<div class="heroScore"><strong id="homeScore">0</strong><span>POINT</span></div>
</div>

<div class="grid" id="cards"></div>
<div class="footerNote">게임을 끝내면 점수가 자동으로 저장됩니다. 7개를 모두 완료하면 오늘의 체육 점수를 확인할 수 있어요.</div>
</section>

<section id="station" class="hidden">
<div class="screen">
<div class="stationHead">
<button class="back" id="back">← 목록</button>
<h2 id="stationTitle"></h2>
<span class="tag" id="stationTag"></span>
</div>
<div id="body"></div>
</div>
</section>

<section id="daily" class="hidden"></section>
</div>

<script>
const GAMES=[
{id:"squat",name:"스쿼트",icon:"🏋️",desc:"정확한 자세로 스쿼트",time:45},
{id:"jacks",name:"팔벌려뛰기",icon:"🤸",desc:"팔과 다리를 크게 벌려!",time:30},
{id:"mole",name:"두더지잡기",icon:"🔨",desc:"나오는 두더지를 빠르게!",time:30},
{id:"reaction",name:"반응속도 45초",icon:"⚡",desc:"숫자를 순서대로 터치!",time:45},
{id:"hunter",name:"넘버헌터",icon:"🔢",desc:"숨어 있는 숫자를 찾아라!",time:30},
{id:"erase",name:"칠판 지우기",icon:"🧽",desc:"칠판의 글씨를 빠르게 지워!",time:30},
{id:"calc",name:"계산 눈치 게임",icon:"🧠",desc:"정답을 빠르게 골라!",time:30}
];

const scores=JSON.parse(localStorage.getItem("schoolGymScores7")||"{}");
let timer=null,active=false,current=null,raf=null,stream=null,pose=null,gameData={};

const $=id=>document.getElementById(id);

function save(){
localStorage.setItem("schoolGymScores7",JSON.stringify(scores));
}

function average(){
let a=GAMES.map(g=>scores[g.id]).filter(v=>typeof v==="number");
return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
}

function renderHome(){
$("homeScore").textContent=average();

const done=GAMES.filter(g=>typeof scores[g.id]==="number").length;

$("heroText").textContent=
done===7
?"🎉 7개 게임 완료! 오늘의 체육 점수를 확인해 보세요."
:`${done}/7 게임 완료 · 원하는 게임부터 시작해 보세요.`;

$("bar").style.width=(done/7*100)+"%";

$("cards").innerHTML=GAMES.map((g,i)=>`
<article class="card ${scores[g.id]!=null?"done":""}">
<div>
<div class="num">GAME 0${i+1}</div>
<div class="icon">${g.icon}</div>
<h3>${g.name}</h3>
<p>${g.desc}</p>
</div>
<button onclick="openGame('${g.id}')">
${scores[g.id]!=null?`완료 · ${scores[g.id]}점`:"게임 시작 →"}
</button>
</article>`).join("");
}

function clearRun(){
clearInterval(timer);
timer=null;
cancelAnimationFrame(raf);
active=false;

if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}
}

function backHome(){
clearRun();
$("station").classList.add("hidden");
$("daily").classList.add("hidden");
$("home").classList.remove("hidden");
renderHome();
}

$("back").onclick=backHome;

function openGame(id){
clearRun();

current=GAMES.find(g=>g.id===id);

$("home").classList.add("hidden");
$("daily").classList.add("hidden");
$("station").classList.remove("hidden");

$("stationTitle").textContent=current.icon+" "+current.name;
$("stationTag").textContent="GAME 0"+(GAMES.indexOf(current)+1);

({
squat:renderSquat,
jacks:renderJacks,
mole:renderMole,
reaction:renderReaction,
hunter:renderHunter,
erase:renderErase,
calc:renderCalc
}[id])();
}

function side(rule,hint,stats,startId="startBtn"){
return `
<aside class="side">
<h4>HOW TO PLAY</h4>
<div class="rule">${rule}</div>
<div class="hint">${hint}</div>
<div class="stats">${stats}</div>
<div id="msg" class="live">시작 버튼을 눌러 시작!</div>
<button class="start" id="${startId}">시작하기</button>
</aside>`;
}

function layout(play,sideHtml){
$("body").innerHTML=`
<div class="gameLayout">
<div class="playArea">${play}</div>
${sideHtml}
</div>`;
}

function endGame(score,extra=""){
score=Math.max(0,Math.min(100,Math.round(score)));
scores[current.id]=score;
save();
active=false;
clearInterval(timer);
$("msg").textContent="게임 종료!";
showResult(score,extra);
}

function showResult(score,extra){
const p=document.createElement("div");
p.className="result";

p.innerHTML=`
<div class="resultBox">
<div style="font-weight:900;color:#64748b">GAME RESULT</div>
<div class="big">${score}</div>
<b>POINT</b>
<p>${extra||"좋아요! 다음 게임에 도전해 보세요."}</p>
<button onclick="backHome()">목록으로 돌아가기</button>
</div>`;

document.querySelector(".playArea").appendChild(p);
}

function countdown(sec,fn){
let t=sec;
active=true;
fn(t);

timer=setInterval(()=>{
t--;
fn(t);

if(t<=0){
clearInterval(timer);
timer=null;
active=false;
}
},1000);
}

/* camera */
async function camera(video){
try{
stream=await navigator.mediaDevices.getUserMedia({
video:{width:1280,height:720},
audio:false
});

video.srcObject=stream;
return true;
}
catch(e){
$("msg").textContent="카메라 권한을 허용해 주세요.";
return false;
}
}

function loadPose(){
if(pose)return Promise.resolve(pose);

return new Promise(resolve=>{
if(window.Pose){
pose=new Pose({
locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
});

pose.setOptions({
modelComplexity:1,
smoothLandmarks:true,
minDetectionConfidence:.55,
minTrackingConfidence:.55
});

resolve(pose);
return;
}

const s=document.createElement("script");

s.src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js";

s.onload=()=>{
pose=new Pose({
locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
});

pose.setOptions({
modelComplexity:1,
smoothLandmarks:true,
minDetectionConfidence:.55,
minTrackingConfidence:.55
});

resolve(pose);
};

document.head.appendChild(s);
});
}

async function startPose(video,handler){
const p=await loadPose();

await camera(video);

const loop=async()=>{
if(!active)return;

try{
await p.send({image:video});
}catch(e){}

raf=requestAnimationFrame(loop);
};

p.onResults(handler);
loop();
}

/* squat */
function renderSquat(){

layout(`
<div class="camWrap">
<video id="video" autoplay playsinline></video>
<canvas id="canvas" class="overlay"></canvas>
<div class="guideLine"></div>
<div class="guideText">전신이 화면에 보이게 서세요</div>
</div>`,

side(
"무릎을 굽혀<br>깊게 앉았다 일어나!",
"발이 모두 보이도록 서고, 허리를 너무 숙이지 마세요.",
`<div class="stat">횟수<b id="count">0</b></div>
<div class="stat">시간<b id="time">45</b></div>`
));

$("startBtn").onclick=startSquat;
}

async function startSquat(){

if(active)return;

$("startBtn").textContent="진행 중…";
$("startBtn").classList.add("running");
$("count").textContent=0;

gameData={phase:"up",count:0};

const video=$("video");

await startPose(video,r=>{
if(!active||!r.poseLandmarks)return;

const p=r.poseLandmarks;

const a1=ang(p[23],p[25],p[27]);
const a2=ang(p[24],p[26],p[28]);
const a=(a1+a2)/2;

if(a<110)gameData.phase="down";

if(a>155&&gameData.phase==="down"){
gameData.count++;
gameData.phase="up";
$("count").textContent=gameData.count;
}

$("msg").textContent=
a<110
?"⬇️ 더 내려가세요!"
:"⬆️ 좋아요!";
});

countdown(45,t=>{
$("time").textContent=t;

if(t<=0){
endGame(
Math.min(100,gameData.count*4),
`${gameData.count}회 성공`
);
}
});
}

function ang(a,b,c){
if(!a||!b||!c)return 180;

const ab={
x:a.x-b.x,
y:a.y-b.y
};

const cb={
x:c.x-b.x,
y:c.y-b.y
};

const dot=ab.x*cb.x+ab.y*cb.y;
const l=Math.hypot(ab.x,ab.y)*Math.hypot(cb.x,cb.y);

return Math.acos(
Math.max(-1,Math.min(1,dot/l))
)*180/Math.PI;
}

/* jumping jacks */
function renderJacks(){

layout(`
<div class="camWrap">
<video id="video" autoplay playsinline></video>
<canvas id="canvas" class="overlay"></canvas>
<div class="guideLine"></div>
<div class="guideText">팔·다리를 크게 벌렸다 모으세요</div>
</div>`,

side(
"팔과 다리를<br>크게 벌려!",
"전신이 화면에 들어오게 서서 팔과 다리를 동시에 벌렸다 모아 주세요.",
`<div class="stat">성공<b id="count">0</b></div>
<div class="stat">시간<b id="time">30</b></div>`
));

$("startBtn").onclick=startJacks;
}

async function startJacks(){

if(active)return;

$("startBtn").textContent="진행 중…";

gameData={
open:false,
count:0
};

await startPose($("video"),r=>{

if(!active||!r.poseLandmarks)return;

const p=r.poseLandmarks;

const lw=p[15],
rw=p[16],
la=p[27],
ra=p[28],
ls=p[11],
rs=p[12];

if(!lw||!rw||!la||!ra)return;

const shoulder=Math.abs(ls.x-rs.x);
const ankle=Math.abs(la.x-ra.x);

const arms=
lw.y<ls.y-.08 &&
rw.y<rs.y-.08;

const legs=
ankle>shoulder*1.35;

if(arms&&legs&&!gameData.open){
gameData.open=true;
$("msg").textContent="🟢 벌리기 성공!";
}

if(!arms&&!legs&&gameData.open){
gameData.open=false;
gameData.count++;
$("count").textContent=gameData.count;
$("msg").textContent="좋아요!";
}

});

countdown(30,t=>{
$("time").textContent=t;

if(t<=0){
endGame(
Math.min(100,gameData.count*5),
`${gameData.count}회 성공`
);
}
});
}

/* mole */
function renderMole(){

const holes=Array.from(
{length:9},
(_,i)=>`
<button class="hole" data-i="${i}">
<span class="moleFace">😎</span>
</button>`
).join("");

layout(
`<div class="moleBoard" id="moles">${holes}</div>`,

side(
"두더지가 나오면<br>빠르게 눌러!",
"30초 동안 나타나는 두더지를 최대한 많이 잡으세요.",
`<div class="stat">성공<b id="count">0</b></div>
<div class="stat">시간<b id="time">30</b></div>`
));

document.querySelectorAll(".hole").forEach(h=>
h.onclick=()=>{
if(active&&h.classList.contains("active")){
h.classList.remove("active");
gameData.hit++;
$("count").textContent=gameData.hit;
}
});

$("startBtn").onclick=startMole;
}

function startMole(){

if(active)return;

$("startBtn").textContent="진행 중…";

gameData={hit:0};

let last=-1;

const pop=()=>{

if(!active)return;

document.querySelectorAll(".hole")
.forEach(h=>h.classList.remove("active"));

let i=Math.floor(Math.random()*9);

while(i===last)
i=Math.floor(Math.random()*9);

last=i;

document
.querySelector(`.hole[data-i="${i}"]`)
.classList.add("active");

setTimeout(()=>{
const h=document.querySelector(`.hole[data-i="${i}"]`);
if(h)h.classList.remove("active");
},700);

setTimeout(pop,850);
};

active=true;
pop();

countdown(30,t=>{
$("time").textContent=t;

if(t<=0){
endGame(
Math.min(100,gameData.hit*5),
`${gameData.hit}마리 잡기 성공`
);
}
});
}

/* reaction */
function renderReaction(){

layout(
`<div id="reactionArea" style="position:absolute;inset:0;background:#eef4f8">
<div class="guideText">숫자를 1 → 2 → 3… 순서대로 눌러!</div>
<div id="reactionTarget" class="target reaction">
<span>1</span>
</div>
</div>`,

side(

"45초 동안 나타나는 숫자를 순서대로 클릭하세요. 맞히면 다음 숫자가 새 위치에 나타납니다.",
`<div class="stat">성공<b id="count">0</b></div>
<div class="stat">시간<b id="time">45</b></div>`
));

}

function placeReaction(){

const t=$("reactionTarget");
const a=$("reactionArea");

t.style.left=(8+Math.random()*76)+"%";
t.style.top=(20+Math.random()*65)+"%";

t.querySelector("span").textContent=gameData.next;
}

function startReaction(){

if(active)return;

$("startBtn").textContent="진행 중…";

gameData={
next:1,
hit:0
};

placeReaction();

$("reactionTarget").onclick=()=>{

if(!active)return;

gameData.hit++;
gameData.next++;

$("count").textContent=gameData.hit;

const t=$("reactionTarget");

t.classList.add("fade");

setTimeout(()=>{
t.classList.remove("fade");
placeReaction();
},130);
};

countdown(45,t=>{
$("time").textContent=t;

if(t<=0){
endGame(
Math.min(100,gameData.hit*4),
`${gameData.hit}개 성공`
);
}
});
}

function spawnHunter(){

const box=$("hunterTargets");

box.innerHTML="";

const nums=[];

for(let i=0;i<12;i++)
nums.push(gameData.next+i);

nums.sort(()=>Math.random()-.5);

nums.forEach(n=>{

const b=document.createElement("button");

b.className="target numberTarget";

b.style.left=(6+Math.random()*84)+"%";
b.style.top=(16+Math.random()*72)+"%";

b.textContent=n;

b.onclick=()=>{

if(!active)return;

if(n===gameData.next){

gameData.hit++;
gameData.next++;

$("count").textContent=gameData.hit;

b.classList.add("fade");

setTimeout(()=>b.remove(),100);

if(gameData.next>20){

endGame(
100,
"20개 모두 성공!"
);

return;
}

}else{

$("msg").textContent="❌ 순서를 확인하세요.";

setTimeout(()=>
$("msg").textContent="",
500
);
}
};

box.appendChild(b);
});
}

/* calculation */
function renderCalc(){

layout(
`<div class="calc">
<div class="guideText" style="top:14px;left:14px">
정답을 빠르게 선택!
</div>

<div class="equation" id="eq">
3 + 4 = ?
</div>

<div class="answers" id="answers"></div>
</div>`,

side(
"계산하고<br>정답을 골라!",
"30초 동안 나오는 계산 문제의 정답을 빠르게 눌러 보세요.",
`<div class="stat">정답<b id="count">0</b></div>
<div class="stat">시간<b id="time">30</b></div>`
));

$("startBtn").onclick=startCalc;
}

function newCalc(){

let a=1+Math.floor(Math.random()*9);
let b=1+Math.floor(Math.random()*9);

let op=Math.random()<.5?"+":"-";

if(op==="-"&&b>a)
[a,b]=[b,a];

let ans=op==="+"?a+b:a-b;

gameData.answer=ans;

$("eq").textContent=`${a} ${op} ${b} = ?`;

let opts=[ans];

while(opts.length<4){

let x=ans+Math.floor(Math.random()*9)-4;

if(x>=0&&!opts.includes(x))
opts.push(x);
}

opts.sort(()=>Math.random()-.5);

$("answers").innerHTML=opts
.map(x=>`<button>${x}</button>`)
.join("");

document
.querySelectorAll("#answers button")
.forEach(b=>

b.onclick=()=>{

if(!active)return;

if(Number(b.textContent)===gameData.answer){

gameData.hit++;

$("count").textContent=gameData.hit;

$("msg").textContent="⭕ 정답!";

newCalc();

}else{

$("msg").textContent="❌ 다시 계산!";

setTimeout(()=>
$("msg").textContent="",
450
);

}
});
}

function startCalc(){

if(active)return;

$("startBtn").textContent="진행 중…";

gameData={hit:0};

newCalc();

countdown(30,t=>{

$("time").textContent=t;

if(t<=0){

endGame(
Math.min(100,gameData.hit*8),
`${gameData.hit}문제 정답`
);

}
});
}
